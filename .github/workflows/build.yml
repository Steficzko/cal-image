name: build
# Rebuilds the cal.com (calcom/cal.diy) image on a patched Node. Upstream stopped
# publishing images after v6.2.0 (March 2026) and its Dockerfile still uses node:20 (EOL).
on:
  workflow_dispatch:
    inputs:
      cal_ref:
        description: "calcom/cal.diy tag to build"
        default: "v6.2.0"
      node_image:
        description: "Node base image (pin a patched release)"
        default: "node:22.23.4"
      next_version:
        description: "Force this Next.js version via root resolutions (empty = upstream's pin)"
        default: ""
  push:
    branches: [main]
    paths: [".github/workflows/build.yml"]

permissions:
  contents: read
  packages: write

env:
  CAL_REF: ${{ inputs.cal_ref || 'v6.2.0' }}
  NODE_IMAGE: ${{ inputs.node_image || 'node:22.23.4' }}
  NEXT_VERSION: ${{ inputs.next_version }}
  IMAGE: ghcr.io/steficzko/cal

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Same as upstream's own image build: next build wants a reachable Postgres.
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: cal, POSTGRES_PASSWORD: cal, POSTGRES_DB: cal }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: calcom/cal.diy
          ref: ${{ env.CAL_REF }}
          path: src

      - name: Swap the end-of-life node:20 base for a patched Node
        run: |
          sed -i -E "s#node:20( |$)#${NODE_IMAGE}\1#g" src/Dockerfile
          grep -n '^FROM' src/Dockerfile
          ! grep -q 'node:20' src/Dockerfile

      - name: Override Next.js (root resolutions; yarn install re-resolves the lockfile)
        if: env.NEXT_VERSION != ''
        run: |
          jq --arg v "$NEXT_VERSION" '.resolutions += {"next": $v, "@next/bundle-analyzer": $v}' \
            src/package.json > src/package.json.new && mv src/package.json.new src/package.json
          jq .resolutions src/package.json | grep -E '"(next|@next/bundle-analyzer)"'
          # turbo prune reads yarn.lock, so the lockfile must already carry the override.
          cd src && YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install --mode=update-lockfile
          grep -E '^"next@' yarn.lock
          test "$(grep -cE '^"next@' yarn.lock)" = 1
          rm -rf .yarn/cache .yarn/install-state.gz  # keep the fetched zips out of the image (COPY .yarn)

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (build args as upstream's release action)
        run: |
          TAG="${IMAGE}:${CAL_REF}-node${NODE_IMAGE#node:}${NEXT_VERSION:+-next$NEXT_VERSION}"
          docker build --network host -f src/Dockerfile src \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --build-arg NEXT_PUBLIC_WEBAPP_URL=http://localhost:3000 \
            --build-arg NEXT_PUBLIC_API_V2_URL=http://localhost:5555/api/v2 \
            --build-arg NEXT_PUBLIC_LICENSE_CONSENT=agree \
            --build-arg CALCOM_TELEMETRY_DISABLED=1 \
            --build-arg DATABASE_URL=postgresql://cal:cal@localhost:5432/cal \
            --build-arg DATABASE_DIRECT_URL=postgresql://cal:cal@localhost:5432/cal \
            -t "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Verify the runtime Node is the patched one
        run: |
          v=$(docker run --rm --entrypoint node "$TAG" -v)
          echo "runtime node: $v"
          test "$v" = "v${NODE_IMAGE#node:}"
          n=$(docker run --rm --entrypoint node -w /calcom/apps/web "$TAG" -p 'require("next/package.json").version')
          echo "runtime next: $n"
          test -z "$NEXT_VERSION" || test "$n" = "$NEXT_VERSION"

      - name: Push
        run: |
          docker push "$TAG"
          docker inspect --format '{{index .RepoDigests 0}}' "$TAG" | tee -a "$GITHUB_STEP_SUMMARY"
